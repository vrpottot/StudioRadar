<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b2a60"/>
      <stop offset="100%" stop-color="#241740"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="50%" y1="50%" x2="90%" y2="20%">
      <stop offset="0%" stop-color="#d4c5f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#dceda9" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Squircle rounded background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#d4c5f6" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Concentric Radar Rings -->
  <circle cx="32" cy="32" r="22" stroke="#d4c5f6" stroke-width="1.75" stroke-opacity="0.35"/>
  <circle cx="32" cy="32" r="14" stroke="#d4c5f6" stroke-width="1.75" stroke-opacity="0.55"/>
  <circle cx="32" cy="32" r="6" stroke="#d4c5f6" stroke-width="1.75" stroke-opacity="0.8"/>
  
  <!-- Radar Crosshairs (subtle) -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="#d4c5f6" stroke-width="1.25" stroke-opacity="0.25" stroke-dasharray="2 3"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="#d4c5f6" stroke-width="1.25" stroke-opacity="0.25" stroke-dasharray="2 3"/>

  <!-- Radar Sweep Ray -->
  <path d="M32 32 L49 15 A24 24 0 0 0 32 8 Z" fill="url(#beamGrad)"/>
  <line x1="32" y1="32" x2="49" y2="15" stroke="#dceda9" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Target Lead Blips -->
  <circle cx="32" cy="32" r="3" fill="#d4c5f6"/>
  <circle cx="43" cy="21" r="2.5" fill="#dceda9"/>
  <circle cx="21" cy="40" r="2" fill="#d4c5f6" opacity="0.7"/>
</svg>
