name: Deploy StudioRadar to Production Server

on:
  push:
    branches: [main]

concurrency:
  group: studioradar-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, Build & Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test AI and build frontend
        run: |
          npm ci --prefix backend --omit=dev
          npm ci --prefix ai --omit=dev
          npm test --prefix ai
          npm ci --prefix frontend
          npm run build --prefix frontend
          bash -n scripts/deploy.sh

      - name: Package deployment without live data or secrets
        run: |
          mkdir -p staging/backend staging/frontend staging/ai staging/bootstrap
          cp -r backend/src staging/backend/
          cp backend/package.json backend/package-lock.json staging/backend/
          cp backend/leads.json backend/pipelines.json backend/settings.json staging/bootstrap/
          cp ai/*.js ai/package.json ai/package-lock.json staging/ai/
          cp -r frontend/dist staging/frontend/
          cp scripts/deploy.sh staging/deploy.sh
          tar -czf deploy.tar.gz -C staging backend frontend ai bootstrap deploy.sh

      - name: Upload bundle via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 79.137.199.70
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: deploy.tar.gz
          target: /tmp

      - name: Deploy with backup and rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 79.137.199.70
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 15m
          script: |
            set -eu
            release=$(mktemp -d /var/tmp/studioradar-release.XXXXXX)
            tar -xzf /tmp/deploy.tar.gz -C "$release"
            rm -f /tmp/deploy.tar.gz
            bash "$release/deploy.sh" "$release"
